    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      .line-clamp-3 {
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }
      @keyframes scroll-right {
        from { transform: translateX(0); }
        to { transform: translateX(-100%); }
      }
      .animate-marquee {
        animation: scroll-right 60s linear infinite;
      }
      .pause-on-hover:hover .animate-marquee {
        animation-play-state: paused;
      }
      /* Custom Scrollbar Styles */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #1C1C1C;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #4a4a4a;
        border-radius: 10px;
        border: 2px solid #1C1C1C;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #6a6a6a;
      }
      /* For Firefox */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #4a4a4a #1C1C1C;
      }
      /* Animation Keyframes */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
      @keyframes fadeInUp {
        from { opacity: 0; transform: scale(0.98) translateY(1rem); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes fadeOutDown {
        from { opacity: 1; transform: scale(1) translateY(0); }
        to { opacity: 0; transform: scale(0.98) translateY(1rem); }
      }
      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(1.5rem); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-1.5rem); }
        to { opacity: 1; transform: translateX(0); }
      }

      /* Animation Classes */
      .animate-fade-in-fast { animation: fadeIn 0.3s ease-out forwards; }
      .animate-fade-out-fast { animation: fadeOut 0.3s ease-out forwards; }
      .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
      .animate-fade-out-down { animation: fadeOutDown 0.3s ease-out forwards; }
      .animate-slide-in-right { animation: slideInRight 0.3s ease-out forwards; }
      .animate-slide-in-left { animation: slideInLeft 0.3s ease-out forwards; }
    </style>
